<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/image.png" />

    <!-- Viewport para acessibilidade mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tema para navegadores -->
    <meta name="theme-color" content="#000000" />

    <!-- Descrição da aplicação -->
    <meta
      name="description"
      content="Aplicativo Reporta Cotia: plataforma de denúncias e comunicação com a prefeitura."
    />

    <!-- Acessibilidade: cor favorecendo contraste -->
    <style>
      *:focus {
        outline: 3px solid #4a90e2; /* foco visível */
        outline-offset: 2px;
      }
      
      body {
        background-color: #f8f9fa; /* melhora contraste */
      }
    </style>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Reporta Cotia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Mensagem acessível para quem estiver sem JS -->
    <noscript aria-live="polite">
      O JavaScript precisa estar ativado para usar esta aplicação.
    </noscript>

    <!-- Ponto de montagem do React -->
    <div id="root" role="main"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
